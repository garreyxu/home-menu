name: preview-e2e

on:
  deployment_status:

permissions:
  contents: read

# Not a required check. Empty preview secrets must not affect the `checks` job.
concurrency:
  group: preview-e2e-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  preview-e2e:
    name: preview-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview') }}
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Traces and the HTML report stay off: this repo is public and they can leak the bypass header.
      - name: End-to-end tests against the preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_TRACE: off
        run: |
          if [ -z "${PLAYWRIGHT_BASE_URL}" ]; then
            echo "deployment_status had no environment_url or target_url."
            exit 1
          fi
          echo "Preview base URL: ${PLAYWRIGHT_BASE_URL}"
          if [ -z "${E2E_USERNAME}" ] || [ -z "${E2E_PASSWORD}" ]; then
            echo "E2E_USERNAME or E2E_PASSWORD is unset; login tests will skip."
          fi
          pnpm exec playwright test --trace off

      # Page images only. Do not upload traces; those can contain the bypass header.
      - name: Screenshot the signed-in dish wall
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_TRACE: off
          PREVIEW_SCREENSHOTS: "1"
        run: |
          if [ -z "${E2E_USERNAME}" ] || [ -z "${E2E_PASSWORD}" ]; then
            echo "E2E credentials are unset; skipping preview screenshots."
            exit 0
          fi
          pnpm exec playwright test tests/e2e/preview-screenshots.spec.ts --trace off

      - name: Upload preview screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: preview-screenshots
          path: preview-screenshots/
          retention-days: 14
          if-no-files-found: ignore
