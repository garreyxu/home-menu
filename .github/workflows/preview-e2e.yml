name: preview-e2e

# Vercel does not create GitHub Deployments for this repo. It sends repository_dispatch
# instead. The workflow file on the default branch is what GitHub runs, so checkout
# client_payload.git.sha explicitly.
# https://vercel.com/docs/git/vercel-for-github#repository-dispatch-events
# Payload: https://github.com/vercel/repository-dispatch/blob/main/packages/repository-dispatch/README.md
on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      url:
        description: Preview deployment URL. https:// is added when it has no scheme.
        required: true
        type: string
      sha:
        description: 40-character commit SHA to check out and report status on.
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  # upload-artifact and actions/cache save need this. No other scopes.
  actions: write

# Not a required check. Empty preview secrets must not affect the `checks` job.
# Preview runs share a group per commit SHA. Other environments get a unique group
# so a production dispatch cannot cancel the in-progress preview run.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'preview') && format('preview-e2e-{0}', github.event.client_payload.git.sha || inputs.sha) || format('preview-e2e-other-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  preview-e2e:
    name: preview-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The published payload example sets environment to "production". Run only for preview.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'preview' }}
    steps:
      - name: Mark preview-e2e pending on the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
          STATUS_STATE: pending
          STATUS_DESCRIPTION: Preview end-to-end tests are running
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "${STATUS_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Commit SHA must be the 40-character client_payload.git.sha or workflow_dispatch sha input."
            exit 1
          fi
          echo "Commit: ${STATUS_SHA}"
          gh api \
            --method POST \
            --silent \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --raw-field state="${STATUS_STATE}" \
            --raw-field context="preview-e2e" \
            --raw-field target_url="${TARGET_URL}" \
            --raw-field description="${STATUS_DESCRIPTION}"

      - name: Resolve preview base URL
        env:
          RAW_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.url) || github.event.client_payload.url }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_URL}" ]; then
            echo "Deployment URL is missing. Expected client_payload.url or the workflow_dispatch url input."
            exit 1
          fi
          if [[ "${RAW_URL}" == *$'\n'* || "${RAW_URL}" == *$'\r'* ]]; then
            echo "Deployment URL contains a newline."
            exit 1
          fi
          scheme="${RAW_URL%%://*}"
          if [ "${RAW_URL}" != "${scheme}" ]; then
            scheme_lower="$(printf '%s' "${scheme}" | tr '[:upper:]' '[:lower:]')"
            if [ "${scheme_lower}" != "http" ] && [ "${scheme_lower}" != "https" ]; then
              echo "Deployment URL scheme is not http or https."
              exit 1
            fi
            base="${RAW_URL}"
          else
            base="https://${RAW_URL}"
          fi
          {
            echo "PLAYWRIGHT_BASE_URL<<__PREVIEW_BASE_URL__"
            printf '%s\n' "${base}"
            echo "__PREVIEW_BASE_URL__"
          } >> "${GITHUB_ENV}"
          echo "Preview base URL: ${base}"

      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.git.sha || inputs.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Traces and the HTML report stay off: this repo is public and they can leak the bypass header.
      - name: End-to-end tests against the preview
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_TRACE: off
        run: |
          set -euo pipefail
          if [ -z "${PLAYWRIGHT_BASE_URL-}" ]; then
            echo "Preview base URL is unset."
            exit 1
          fi
          echo "Preview base URL: ${PLAYWRIGHT_BASE_URL}"
          if [ -z "${E2E_USERNAME}" ] || [ -z "${E2E_PASSWORD}" ]; then
            echo "E2E_USERNAME or E2E_PASSWORD is unset; login tests will skip."
          fi
          pnpm exec playwright test --trace off

      # Page images only. Do not upload traces; those can contain the bypass header.
      # A failed e2e step skips later steps unless this runs anyway. The job
      # stays red: this step does not use continue-on-error.
      - name: Screenshot the signed-in dish wall
        if: ${{ always() && !cancelled() }}
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_TRACE: off
          PREVIEW_SCREENSHOTS: "1"
        run: |
          set -euo pipefail
          if [ -z "${E2E_USERNAME}" ] || [ -z "${E2E_PASSWORD}" ]; then
            echo "E2E credentials are unset; skipping preview screenshots."
            exit 0
          fi
          pnpm exec playwright test tests/e2e/preview-screenshots.spec.ts --trace off

      - name: Upload preview screenshots
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: preview-screenshots
          path: preview-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report preview-e2e result on the commit
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Preview end-to-end tests passed' || 'Preview end-to-end tests failed' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "${STATUS_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Commit SHA must be the 40-character client_payload.git.sha or workflow_dispatch sha input."
            exit 1
          fi
          echo "preview-e2e status: ${STATUS_STATE}"
          gh api \
            --method POST \
            --silent \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --raw-field state="${STATUS_STATE}" \
            --raw-field context="preview-e2e" \
            --raw-field target_url="${TARGET_URL}" \
            --raw-field description="${STATUS_DESCRIPTION}"

  # Runs after preview-e2e even when that job fails. Empty webhook secrets skip.
  # The step continues on error so a webhook failure cannot fail this workflow.
  # Head SHA comes from the dispatch payload. The PR number comes from
  # GET /repos/{repo}/commits/{sha}/pulls. No associated PR sends pr: null.
  notify:
    name: notify
    needs: [preview-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Notify CI webhook
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROK_CI_WEBHOOK_URL: ${{ secrets.GROK_CI_WEBHOOK_URL }}
          GROK_CI_WEBHOOK_KEY: ${{ secrets.GROK_CI_WEBHOOK_KEY }}
          REPO: garreyxu/home-menu
          HEAD_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
          CONCLUSION: ${{ needs.preview-e2e.result }}
        run: |
          set -euo pipefail
          if [ -z "${GROK_CI_WEBHOOK_URL}" ] || [ -z "${GROK_CI_WEBHOOK_KEY}" ]; then
            echo "Webhook secrets are unset; skipping notify."
            exit 0
          fi
          pr="null"
          if [[ "${HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if pulls="$(gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls")"; then
              parsed="$(printf '%s' "${pulls}" | jq -c \
                --arg sha "${HEAD_SHA}" \
                'if type != "array" or length == 0 then
                  null
                else
                  ([.[] | select(.state == "open" and ((.head.sha // "") | ascii_downcase) == ($sha | ascii_downcase))] | first | .number)
                  // ([.[] | select(.state == "open")] | first | .number)
                  // (.[0].number)
                  // null
                end' || true)"
              if [[ "${parsed}" =~ ^[1-9][0-9]*$ ]]; then
                pr="${parsed}"
              fi
            else
              echo "Could not list pull requests for the commit; sending pr null."
            fi
          else
            echo "Commit SHA is missing or not 40 hex characters; sending pr null."
          fi
          payload="$(jq -nc \
            --arg repo "${REPO}" \
            --argjson pr "${pr}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg workflow "preview-e2e" \
            --arg conclusion "${CONCLUSION}" \
            '{repo:$repo, pr:$pr, head_sha:$head_sha, workflow:$workflow, conclusion:$conclusion}')"
          echo "Notifying preview-e2e conclusion=${CONCLUSION} pr=${pr}."
          curl -fsS -o /dev/null -X POST "${GROK_CI_WEBHOOK_URL}" \
            -H "Authorization: Bearer ${GROK_CI_WEBHOOK_KEY}" \
            -H "Content-Type: application/json" \
            -d "${payload}"
