name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Id and name stay `checks`: this is the required status check.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # PLAYWRIGHT_BASE_URL stays unset so Playwright starts the local dev server.
      # Throwaway auth values exist only for this job. Do not print them.
      - name: End-to-end tests
        run: |
          set -euo pipefail
          export E2E_USERNAME="ci-family"
          export E2E_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
          export AUTH_USERNAME="$E2E_USERNAME"
          export AUTH_PASSWORD_HASH="$(printf '%s' "$E2E_PASSWORD" | pnpm --silent auth:hash | tr -d '\n')"
          export SESSION_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          node --input-type=module -e '
            const hash = process.env.AUTH_PASSWORD_HASH ?? "";
            const secret = process.env.SESSION_SECRET ?? "";
            if (secret.length < 32) {
              console.error("Generated SESSION_SECRET is too short.");
              process.exit(1);
            }
            if (!hash.startsWith("$2")) {
              console.error("auth:hash did not print a bcrypt hash.");
              process.exit(1);
            }
          '
          echo "::add-mask::${E2E_PASSWORD}"
          echo "::add-mask::${AUTH_PASSWORD_HASH}"
          echo "::add-mask::${SESSION_SECRET}"
          export PLAYWRIGHT_TRACE=off
          pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
